<!DOCTYPE html>
<html>
    <head>
        <title>
            Make a diffrent shape
        </title>
        <style>
            h2{
                text-align: center;
            }
            .rectangle{
                border: 3px solid black;
                width: 200px;
                height: 200px;
                margin: auto;
            }
            .buttons {
                padding: 20px;
                display: flex;
                justify-content: center;
                gap: 10px;
            }
        </style>
    </head>
    <body>
        <h2>Make a diffrent shape</h2>
        <div class="rectangle"></div>
        <div class="buttons"></div>
        <button onclick="changeToCircle()">Press me to make a circle</button>
        <button onclick="changeToSquare()">Press me to make a Square</button>
        <button onclick="changeColor()">Press me to change te color of the shape</button>
        <button onclick="hide()">press me to hide the shape</button>
        <button onclick="show()">press me to show the shape</button>
        <script>
            let div = document.querySelector('.rectangle')
            function changeToCircle() {
                div.style.borderRadius = "50%";
            }
             function changeToSquare() {
            div.style.borderRadius = "0";
             }
                       function changeColor() {
                     div.style.backgroundColor = " blue";
                       }
                 function hide() {
                    div.style.visibility = "hidden";
                 }
                 function show() {
                    div.style.visibility = "visible";
                 }
                 div.onmouseenter = function () {
                    div.style.background = 'red';
                 }
                    div.onmouseout = function () {
                            div.style.background = 'none';
                        }
        </script>
    </body>
</html>
