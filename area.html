<!DOCTYPE html>

<body>
    <script>var choice = prompt("Welcome to the area calculator.\nPlease enter your choice.\n 1.Area of a rectangle. \n2.area of a triangle \n3.area of a circle \n4.area of a square");
        if (choice == '1') {
            var l = prompt('Enter the length')
            var b = prompt('Enter the breadth')
            var result = Number(l) * Number(b)
            alert('The area is ' + result)
        }
        if (choice == '2') {
            var h = prompt('Enter the height')
            var b = prompt('Enter the base')
            var result = number(h) * Number(b) / 2
            alert('The area is' + result)
        }
        if (choice == '3') {
            var r = prompt('Enter the raduis')
            var result = 3.14 * Number(r) * Number(r)
            alert('The area is ' + result)
        }
        if (choice == '4') {
            var s = prompt('Enter the side')
            var result = Number(s) * Number(s)
            alert('The area is ' + result)
        }</script>
</body>
